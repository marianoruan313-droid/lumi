workflows:
  lumi-ios-build:
    name: Lumi Camera iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: app.lumicamera.ios
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate --spec project.yml
      - name: Build for iOS device
        script: xcodebuild -project LumiCamera.xcodeproj -scheme LumiCamera -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath $CM_BUILD_DIR/LumiCamera.xcarchive archive CODE_SIGNING_ALLOWED=NO
    artifacts:
      - LumiCamera.xcarchive
      - $CM_BUILD_DIR/**/*.log
